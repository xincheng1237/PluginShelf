name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: swift --version
      - name: Core tests
        run: swift test
      - name: Universal 2 app
        run: ./Packaging/build.sh
      - name: Validate bundle
        run: |
          codesign --verify --strict outputs/PluginShelf.app
          lipo outputs/PluginShelf.app/Contents/MacOS/PluginShelf -verify_arch arm64 x86_64
